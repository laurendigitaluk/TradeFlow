<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirming email — TradeFlow</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7f9;color:#17212b;margin:0;min-height:100vh;display:grid;place-items:center}
.card{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #d8dee5;border-radius:12px;padding:32px;box-sizing:border-box;text-align:center}
h1{margin:0 0 10px;font-size:26px}.message{color:#596774;line-height:1.5}
.error{color:#9b2c2c}
</style>
</head>
<body>
<main class="card">
<h1>Confirming your email address</h1>
<p id="message" class="message">Please wait while we confirm your email address.</p>
</main>
<script>
(()=>{
 const SUPABASE_URL='https://twfbmjwwqzxdxvclxbun.supabase.co';
 const params=new URLSearchParams(location.search);
 const token=params.get('token')||params.get('token_hash');
 const type=params.get('type')||'email';
 const tenantId=params.get('tenant_id')||'';
 const message=document.getElementById('message');
 if(!token){
   message.textContent='This confirmation link is missing its verification token. Please request a new confirmation email.';
   message.className='message error';
   return;
 }
 const next=new URL('../customer-email-confirmed.html',location.href);
 if(tenantId)next.searchParams.set('tenant_id',tenantId);
 const verify=new URL(SUPABASE_URL+'/auth/v1/verify');
 verify.searchParams.set('token',token);
 verify.searchParams.set('type',type);
 verify.searchParams.set('redirect_to',next.href);
 location.replace(verify.href);
})();
</script>
</body>
</html>
