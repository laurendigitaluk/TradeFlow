name: BusinessFlow TEST Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    if: github.ref == 'refs/heads/businessflow-standalone-bootstrap-20261023'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated BusinessFlow branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate TEST target and frontend syntax
        run: |
          test -f wrangler.businessflow-test.jsonc
          grep -q '"name": "businessflow-test"' wrangler.businessflow-test.jsonc
          ! grep -Eiq 'tradeflow-test|production' wrangler.businessflow-test.jsonc
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script\\s*>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/businessflow-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/businessflow-inline.js

      - name: Verify isolated Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Deploy BusinessFlow TEST only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.businessflow-test.jsonc
