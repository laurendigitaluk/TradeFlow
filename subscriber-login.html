<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFlow — Sign in</title><link rel="stylesheet" href="platform.css?v=16"><link rel="stylesheet" href="signup.css?v=2"></head><body><header class="topbar"><a class="brand" href="index.html">TradeFlow</a></header><main class="signup-wrap"><section class="signup-card"><div class="eyebrow">Subscriber access</div><h1>Sign in to TradeFlow</h1><p>Access your private business dashboard.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary full" type="submit" id="submit">Sign in</button><div id="message" role="status"></div></form><p class="small">New to TradeFlow? <a href="subscriber-signup.html">Create your business account</a>.</p></section></main><script>window.addEventListener('DOMContentLoaded',()=>{const p=new URLSearchParams(location.search),m=document.getElementById('message');if(p.get('signup')==='created'){m.className='success';m.textContent='Your account has been created. Check your email to confirm it, then sign in to continue to secure Stripe Checkout.'}if(p.get('subscription')==='success'){m.className='success';m.textContent='Your subscription was received. TradeFlow is completing your business setup.'}if(p.get('cancelled')==='1'){m.textContent='Checkout was cancelled. Your account remains available; sign in when you are ready to start the subscription.'}});window.addEventListener('DOMContentLoaded',()=>{const form=document.getElementById('login-form'),msg=document.getElementById('message'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)throw Error('Enter your email and password.');const h=location.hostname;const isTest=h==='localhost'||h==='127.0.0.1'||h.endsWith('.github.io')||h==='tradeflow-test.leannelaurenlowe.workers.dev';const supabaseUrl=isTest?'https://twfbmjwwqzxdxvclxbun.supabase.co':'https://gxsrajtqzdjvmceqcpgv.supabase.co';const key=isTest?'sb_publishable_AvcMgtUKV0O5k8H6k94mZQ_qH4pEIS9':'sb_publishable_Y8NRuGXqHNTu9oaolrpprw_wysMNLuz';const r=await fetch(supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const b=await r.json();if(!r.ok||!b.access_token)throw Error(b?.error_description||b?.message||'Sign in failed.');localStorage.setItem('tradeflow_subscriber_session',JSON.stringify(b));
const membershipRes=await fetch(supabaseUrl+'/rest/v1/rpc/subscriber_get_my_memberships',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+b.access_token,'Content-Type':'application/json'}});
const memberships=membershipRes.ok?await membershipRes.json():[];
if(Array.isArray(memberships)&&memberships.length){localStorage.removeItem('tradeflow_pending_signup');window.location.href='subscriber-dashboard.html';return}
const meta=b.user?.user_metadata||{};let pending={};try{pending=JSON.parse(localStorage.getItem('tradeflow_pending_signup')||'{}')}catch{}
const businessName=String(meta.business_name||pending.business_name||'').trim(),planCode=String(meta.plan_code||pending.plan_code||'enhanced').trim();
if(!businessName)throw Error('This account is not connected to a TradeFlow business. Return to Get started and complete the subscription signup.');
const checkout=await fetch(supabaseUrl+'/functions/v1/create-subscriber-checkout-session',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+b.access_token,'Content-Type':'application/json'},body:JSON.stringify({business_name:businessName,plan_code:planCode})});
const checkoutText=await checkout.text();let checkoutBody=null;try{checkoutBody=checkoutText?JSON.parse(checkoutText):null}catch{}
if(!checkout.ok||!checkoutBody?.checkout_url)throw Error(checkoutBody?.error||checkoutBody?.message||checkoutText||'Unable to start TradeFlow subscription checkout.');
window.location.href=checkoutBody.checkout_url;
}catch(err){msg.className='error';msg.textContent=err.message||String(err)}finally{btn.disabled=false;btn.textContent='Sign in'}})});</script></body></html>
