name: BusinessFlow Review Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-businessflow-review:
    if: github.ref == 'refs/heads/feature/businessflow-isolated-builder-review-20261023'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated BusinessFlow branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy dedicated BusinessFlow review Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)
          npx --yes wrangler@4 deploy --config wrangler.businessflow.jsonc
