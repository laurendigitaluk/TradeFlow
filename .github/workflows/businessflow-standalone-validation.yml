name: BusinessFlow Standalone Validation

on:
  push:
    branches:
      - businessflow-standalone-bootstrap-20261023
    paths:
      - 'businessflow-standalone/**'
      - 'wrangler.businessflow-test.jsonc'
      - 'wrangler.businessflow-live.jsonc'
      - '.github/workflows/businessflow-standalone-validation.yml'
  pull_request:
    paths:
      - 'businessflow-standalone/**'
      - 'wrangler.businessflow-test.jsonc'
      - 'wrangler.businessflow-live.jsonc'
      - '.github/workflows/businessflow-standalone-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/businessflow-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/businessflow-inline.js

      - name: Verify Supabase client library is loaded before editor code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          library = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if library not in html:
              raise SystemExit("Supabase JS client library is missing from the page")
          if html.index(library) > html.index("<script>"):
              raise SystemExit("Supabase JS client must load before the inline editor code")
          if "window.supabase.createClient" not in html:
              raise SystemExit("Supabase client initialization was not found")
          print("Supabase JS client is loaded before the editor initializes it.")
          PY

      - name: Verify isolated environment configuration
        run: |
          test -f wrangler.businessflow-test.jsonc
          test -f wrangler.businessflow-live.jsonc
          grep -q '"name": "businessflow-test"' wrangler.businessflow-test.jsonc
          grep -q '"name": "businessflow-live"' wrangler.businessflow-live.jsonc
          ! grep -Eiq 'tradeflow-test|production' wrangler.businessflow-test.jsonc
          ! grep -Eiq 'tradeflow-test|production' wrangler.businessflow-live.jsonc

      - name: Check BusinessFlow storage policy correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sql = Path("businessflow-standalone/supabase/2026-10-23-storage-rls-correction.sql").read_text(encoding="utf-8")
          required = [
              "storage.foldername(objects.name)",
              "s.owner_id = (select auth.uid())",
              "bucket_id = 'businessflow-assets'",
              "for select to authenticated",
              "for insert to authenticated",
              "for update to authenticated",
              "for delete to authenticated",
          ]
          missing = [item for item in required if item not in sql.lower()]
          if missing:
              raise SystemExit("Missing storage-policy protections: " + ", ".join(missing))
          sql_code = "\\n".join(line.split("--", 1)[0] for line in sql.splitlines())
          if "storage.foldername(s.name)" in sql_code.lower():
              raise SystemExit("Incorrect policy: checks the site's name rather than the Storage object path")
          print("BusinessFlow Storage RLS correction contains all four owner-scoped policies.")
          PY

      - name: Check account isolation and custom-page IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          checks = {
              "sign-out reloads to clear unsaved account state": "if(error){authMessage('Sign-out failed: '+error.message);return;}location.reload();" in html,
              "successful sign-in updates auth state without a forced reload": "sb.auth.onAuthStateChange((_event,session)=>" in html and "if(_event==='SIGNED_IN'){location.reload();return;}" not in html,
              "direct account switches clear account-specific editor state": "if(currentUser?.id!==nextUser?.id){savedSiteId=null;" in html and "if(currentUser&&nextUser&&currentUser.id!==nextUser.id){location.reload();return;}" not in html,
              "custom page IDs use UUIDs": "const id='page-'+crypto.randomUUID()" in html,
              "custom page paths retain the complete identifier": "replace(/[^a-z0-9]/gi,'').toLowerCase()||'custom'" in html,
              "logo upload handler exists": "$('uploadAsset').onclick=async()=>" in html,
              "private logo URL refresh handler exists": "async function refreshLogoImage()" in html,
              "logo upload accepts only allowed raster formats": 'accept="image/jpeg,image/png,image/webp,image/gif,image/avif"' in html and "image/svg+xml" not in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if failed:
              raise SystemExit("BusinessFlow isolation checks failed: " + ", ".join(failed))
          PY

      - name: Check draft persistence, upload limits and Worker security
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          worker = Path("businessflow-standalone/src/worker.js").read_text(encoding="utf-8")
          checks = {
              "new sites are owned by the authenticated user": "owner_id:currentUser.id" in html,
              "site updates are scoped to site and owner": ".eq('id',siteId).eq('owner_id',currentUser.id)" in html,
              "site loading is scoped to the current owner": ".eq('owner_id',currentUser.id).order('updated_at'" in html,
              "site settings are persisted": "settings:state" in html,
              "page records are upserted on site and path": "upsert(pageRows,{onConflict:'site_id,path'})" in html,
              "stale pages are identified and deleted": "filter(p=>!activePaths.has(p.path)).map(p=>p.id)" in html and ".delete().in('id',staleIds)" in html,
              "logo upload enforces 10 MB limit": "if(file.size>10*1024*1024)" in html,
              "homepage upload enforces 10 MB limit": "if(file.size>10*1024*1024)" in html,
              "private image previews use expiring signed URLs": "createSignedUrl(objectPath,3600)" in html,
              "worker rejects methods other than GET and HEAD": 'request.method !== "GET" && request.method !== "HEAD"' in worker,
              "worker sets content-type sniffing protection": '"X-Content-Type-Options": "nosniff"' in worker,
              "worker prevents framing": '"X-Frame-Options": "DENY"' in worker,
              "worker disables camera microphone and geolocation": '"Permissions-Policy": "camera=(), microphone=(), geolocation=()"' in worker,
              "editor HTML is not cached and is not indexed": 'headers.set("Cache-Control", "no-store")' in worker and 'headers.set("X-Robots-Tag", "noindex, nofollow, noarchive")' in worker,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if failed:
              raise SystemExit("BusinessFlow runtime-contract checks failed: " + ", ".join(failed))
          PY

      - name: Check BusinessFlow connection messaging and environment isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          test_config = Path("wrangler.businessflow-test.jsonc").read_text(encoding="utf-8")
          live_config = Path("wrangler.businessflow-live.jsonc").read_text(encoding="utf-8")
          checks = {
              "editor points to dedicated BusinessFlow Supabase project": "https://ktvvtdrdwlazfsgkfedo.supabase.co" in html,
              "editor uses publishable key format": "sb_publishable_" in html,
              "editor does not show obsolete disconnected warning": "Not connected to TradeFlow authentication" not in html,
              "draft messaging distinguishes saved and unsaved changes": "Save website to store it in your BusinessFlow draft" in html and "Saved securely as a draft" in html,
              "TEST worker has isolated name": '"name": "businessflow-test"' in test_config,
              "LIVE worker has separate name": '"name": "businessflow-live"' in live_config,
              "public publishing remains disabled": "Public publishing is not implemented yet" in html,
          }
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("BusinessFlow connection checks failed: " + ", ".join(failed))
          PY

      - name: Check visual canvas controls and safe unused-asset cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          checks = {
              "visual canvas and accessible height handle exist": 'id="vbCanvas"' in html and 'id="vbCanvasHeightHandle"' in html,
              "add text, image, button and delete controls exist": all(f'id="{name}"' in html for name in ("vbAddText", "vbAddImage", "vbAddButton", "vbDelete")),
              "canvas element content and layout persist in draft settings": "state.visualCanvasElements=elements.map" in html and "state.visualCanvasHeight=canvasHeight" in html,
              "loaded canvas image assets receive fresh signed URLs": "values?.visualCanvasElements" in html and "createSignedUrl(e.assetPath,3600)" in html,
              "image resize uses natural image aspect ratio": "e.aspect=im.naturalWidth/im.naturalHeight" in html and "Image resized with its aspect ratio preserved" in html,
              "canvas upload has format and 10 MB limits": "const allowed=['image/jpeg','image/png','image/webp','image/gif','image/avif']" in html and "if(file.size>10*1024*1024)" in html,
              "unused-asset cleanup includes persisted page payloads": "pageRows.forEach(row=>collectReferencedSiteAssets(row?.content,siteId,referenced))" in html,
              "cleanup only considers actual storage objects": "files.filter(file=>file.name&&file.id)" in html,
              "cleanup only runs after page save and stale-page cleanup": html.index("const cleanup=await cleanupUnusedSiteAssets(siteId,state,pageRows)") > html.index("if(staleIds.length)"),
              "cleanup reports partial failures instead of claiming success": "file(s) were removed before the error" in html and "unused image cleanup is incomplete" in html,
          }
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("BusinessFlow canvas checks failed: " + ", ".join(failed))
          PY

      - name: Confirm browser code contains no service-role key
        run: |
          ! grep -Eiq 'service_role|SUPABASE_SERVICE_ROLE_KEY' businessflow-standalone/public/index.html
