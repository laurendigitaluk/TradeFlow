<body><header class="topbar"><a class="brand" href="index.html">TradeFlow</a></header><main class="signup-wrap"><section class="signup-card"><div class="eyebrow">Subscriber access</div><h1>Set a new password</h1><p>Choose a new password for your TradeFlow account.</p><form id="reset-form"><label>New password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm new password<input id="confirm-password" type="password" required minlength="8" autocomplete="new-password"></label><button class="primary full" id="submit" type="submit">Update password</button><div id="message" role="status"></div></form><p class="small"><a href="subscriber-login.html">Return to sign in</a></p></section></main>

(()=>{const h=location.hostname,isTest=h==='localhost'||h==='127.0.0.1'||h.endsWith('.github.io')||h==='tradeflow-test.leannelaurenlowe.workers.dev';const url=isTest?'https://nnsshnfkjcflucjrftzi.supabase.co':'https://gxsrajtqzdjvmceqcpgv.supabase.co',key=isTest?'sb_publishable_T_6zeNcVL8WlCWS521n4xw_Nh9ILPBQ':'sb_publishable_Y8NRuGXqHNTu9oaolrpprw_wysMNLuz';const msg=document.getElementById('message'),form=document.getElementById('reset-form'),btn=document.getElementById('submit');let hash=new URLSearchParams(location.hash.slice(1));let accessToken=hash.get('access_token'),refreshToken=hash.get('refresh_token'),type=hash.get('type');if(location.search.includes('error=')){msg.className='error';msg.textContent='This password-reset link is invalid or has expired. Request a new one from the sign-in page.';form.hidden=true;return;}if(type!=='recovery'||!accessToken){msg.className='error';msg.textContent='Open the password-reset link from your email to continue. If it brought you here without a recovery token, request a fresh link from the sign-in page.';form.hidden=true;return;}history.replaceState(null,'',location.pathname+location.search);fetch(url+'/auth/v1/user',{headers:{apikey:key,Authorization:'Bearer '+accessToken}}).then(r=>{if(!r.ok)throw Error('The recovery link has expired. Request a new one.');}).catch(e=>{form.hidden=true;msg.className='error';msg.textContent=e.message;});form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const p=document.getElementById('password').value,c=document.getElementById('confirm-password').value;if(p.length<8){msg.className='error';msg.textContent='Use at least 8 characters.';return;}if(p!==c){msg.className='error';msg.textContent='The passwords do not match.';return;}btn.disabled=true;btn.textContent='Updating…';try{const r=await fetch(url+'/auth/v1/user',{method:'PUT',headers:{apikey:key,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:p})});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={}}if(!r.ok)throw Error(d.msg||d.message||'Unable to update password. Request a fresh recovery link and try again.');msg.className='success';msg.textContent='Password updated. Taking you to sign in…';setTimeout(()=>location.href='subscriber-login.html?password_reset=success',1200);}catch(err){msg.className='error';msg.textContent=err.message||String(err);}finally{btn.disabled=false;btn.textContent='Update password';}});})();
