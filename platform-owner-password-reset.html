<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset TradeFlow owner password</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7f9;color:#17212b;margin:0;min-height:100vh;display:grid;place-items:center}
.card{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #d8dee5;border-radius:12px;padding:32px;box-sizing:border-box}
h1{margin:0 0 10px;font-size:26px}.message{color:#596774;line-height:1.5}.error{color:#9b2c2c}.success{color:#245f3b}
label{display:block;font-weight:700;margin-top:16px}input{display:block;width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd6dd;border-radius:6px;margin-top:6px}
button{margin-top:18px;padding:11px 16px;border:0;border-radius:7px;background:#17212b;color:#fff;font-weight:700;cursor:pointer}
a{color:#1f5f9d}
</style>
</head>
<body>
<main class="card">
<h1>Set a new TradeFlow owner password</h1>
<p id="message" class="message">Checking your password-reset link…</p>
<form id="form" hidden>
<label>New password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label>
<label>Confirm password<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
<button id="submit" type="submit">Update owner password</button>
</form>
<p id="back" hidden><a href="/platform-owner-dashboard.html">Return to Owner Dashboard</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
 const SUPABASE_URL='https://gxsrajtqzdjvmceqcpgv.supabase.co';
 const SUPABASE_KEY='sb_publishable_Y8NRuGXqHNTu9oaolrpprw_wysMNLuz';
 const message=document.getElementById('message'),form=document.getElementById('form'),back=document.getElementById('back');
 const hash=new URLSearchParams(location.hash.replace(/^#/,''));
 const accessToken=hash.get('access_token'),refreshToken=hash.get('refresh_token'),type=hash.get('type');
 if(type!=='recovery'||!accessToken||!refreshToken){
   message.textContent='This password-reset link is missing or has expired. Return to the Owner Dashboard and request a new one.';
   message.className='message error';back.hidden=false;return;
 }
 const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 const sessionResult=await client.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
 if(sessionResult.error){
   message.textContent=sessionResult.error.message||'This password-reset link is invalid or expired.';
   message.className='message error';back.hidden=false;return;
 }
 const userResult=await client.auth.getUser();
 if(userResult.error||!userResult.data?.user){
   message.textContent='The reset session could not be verified.';
   message.className='message error';back.hidden=false;return;
 }
 const user=userResult.data.user;
 const {data:membership,error:membershipError}=await client.from('platform_memberships').select('id').eq('user_id',user.id).eq('status','active').limit(1);
 if(membershipError||!membership?.length){
   await client.auth.signOut();
   message.textContent='This reset link is not valid for an active TradeFlow platform owner.';
   message.className='message error';back.hidden=false;return;
 }
 message.textContent='Enter a new password for the active TradeFlow platform owner account.';
 form.hidden=false;
 form.addEventListener('submit',async e=>{
   e.preventDefault();
   const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,button=document.getElementById('submit');
   if(password.length<8){message.textContent='Password must be at least 8 characters.';message.className='message error';return}
   if(password!==confirm){message.textContent='The passwords do not match.';message.className='message error';return}
   button.disabled=true;button.textContent='Updating…';
   const result=await client.auth.updateUser({password});
   if(result.error){
     message.textContent=result.error.message||'The password could not be updated. Please request a new reset email.';
     message.className='message error';button.disabled=false;button.textContent='Update owner password';return;
   }
   message.textContent='Your TradeFlow owner password has been updated.';
   message.className='message success';form.hidden=true;back.hidden=false;
   setTimeout(()=>location.replace('/platform-owner-dashboard.html'),1200);
 });
})();
</script>
</body>
</html>
