<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFlow Fulfilment</title><link rel="stylesheet" href="subscriber-dashboard.css?v=3"></head><body><header class="topbar"><div class="brand">TradeFlow / Fulfilment</div><div><span id="business-name">Subscriber Business</span><button id="sign-out" type="button">Sign out</button></div></header><main class="layout"><aside class="sidebar"><nav><a href="subscriber-dashboard.html">Dashboard</a><a href="buying-dashboard.html">Buying</a><a href="acquisition-dashboard.html">Acquisitions</a><a href="inventory-dashboard.html">Inventory</a><a href="selling-dashboard.html">Selling</a><a href="orders-dashboard.html">Orders</a><a class="active" href="fulfilment-dashboard.html">Fulfilment</a><a href="returns-dashboard.html">Returns</a><a href="finance-dashboard.html">Finance</a></nav></aside><section class="content"><div class="eyebrow">Order fulfilment</div><h1>Fulfilment</h1><p class="intro">Prepare, dispatch and track customer orders using the existing fulfilment workflow.</p><div id="message" class="small"></div><section class="panel"><h2>Create fulfilment</h2><form id="fulfilment-form"><label>Paid / fulfilment order<select id="order" required></select></label><label>Recipient name<input id="recipient-name"></label><label>Recipient email<input id="recipient-email" type="email"></label><label>Carrier<input id="carrier"></label><label>Service<input id="service"></label><label>Tracking number<input id="tracking"></label><label>Tracking URL<input id="tracking-url" type="url"></label><label>Shipping label URL<input id="label-url" type="url" placeholder="Paste the generated label link"></label><label>Notes<textarea id="notes" rows="3"></textarea></label><button type="submit">Create fulfilment</button></form></section><section class="panel"><h2>Fulfilments</h2><button id="refresh" type="button">Refresh</button><div id="fulfilments"><div class="empty">Loading…</div></div></section></section></main><script src="subscriber-auth.js?v=7"></script><script src="subscriber-tenant-context.js?v=5"></script><script src="fulfilment-dashboard.js?v=2" defer></script></body></html>
