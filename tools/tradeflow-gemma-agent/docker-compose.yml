services:
  searxng:
    image: searxng/searxng:latest
    container_name: tradeflow-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-tradeflow-local-development-secret-change-this}
    volumes:
      - ./searxng:/etc/searxng:rw
