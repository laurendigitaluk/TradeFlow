name: Deploy TradeFlow LIVE Worker

on:
  push:
    branches:
      - production
    paths:
      - 'platform-owner-dashboard.html'
      - 'platform-owner-dashboard.js'
      - 'platform-owner-dashboard.css'
      - 'subscriber-dashboard.html'
      - 'subscriber-dashboard.css'
      - 'subscriber-auth.js'
      - 'subscriber-tenant-context.js'
      - 'free-tools.html'
      - 'free-tools.css'
      - 'free-tools.js'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-tradeflow-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradeflow-live-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy TradeFlow Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.0"
          command: deploy --config wrangler.jsonc
