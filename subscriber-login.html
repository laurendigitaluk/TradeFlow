<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFlow — Sign in</title><link rel="stylesheet" href="platform.css?v=16"><link rel="stylesheet" href="signup.css?v=2"></head><body><header class="topbar"><a class="brand" href="index.html">TradeFlow</a><a href="subscriber-signup.html" class="login">Create account</a></header><main class="signup-wrap"><section class="signup-card"><div class="eyebrow">Subscriber access</div><h1>Sign in to TradeFlow</h1><p>Access your private business dashboard.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary full" type="submit" id="submit">Sign in</button><div id="message" role="status"></div></form><p class="small">New to TradeFlow? <a href="subscriber-signup.html">Create your business account</a>.</p></section><aside class="signup-info"><div class="eyebrow">New business?</div><h2>Start your TradeFlow workspace</h2><p>Create your account and choose Basic or Enhanced to begin.</p><a class="button primary full" href="subscriber-signup.html">Create account</a></aside></main><script>window.addEventListener('DOMContentLoaded',()=>{const form=document.getElementById('login-form'),msg=document.getElementById('message'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)throw Error('Enter your email and password.');const key='sb_publishable_AvcMgtUKV0O5k8H6k94mZQ_qH4pEIS9';const r=await fetch('https://twfbmjwwqzxdxvclxbun.supabase.co/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const b=await r.json();if(!r.ok||!b.access_token)throw Error(b?.error_description||b?.message||'Sign in failed.');localStorage.setItem('tradeflow_subscriber_session',JSON.stringify(b));window.location.href='subscriber-dashboard.html'}catch(err){msg.textContent=err.message||String(err)}finally{btn.disabled=false;btn.textContent='Sign in'}})});</script></body></html>
