name: BusinessFlow Standalone Validation

on:
  push:
    branches:
      - businessflow-standalone-bootstrap-20261023
    paths:
      - 'businessflow-standalone/**'
      - 'wrangler.businessflow-test.jsonc'
      - 'wrangler.businessflow-live.jsonc'
      - '.github/workflows/businessflow-standalone-validation.yml'
  pull_request:
    paths:
      - 'businessflow-standalone/**'
      - 'wrangler.businessflow-test.jsonc'
      - 'wrangler.businessflow-live.jsonc'
      - '.github/workflows/businessflow-standalone-validation.yml'
      - 'businessflow-standalone/README.md'
      - 'docs/BUSINESSFLOW_*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/businessflow-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/businessflow-inline.js

      - name: Verify isolated environment configuration
        run: |
          test -f wrangler.businessflow-test.jsonc
          test -f wrangler.businessflow-live.jsonc
          grep -q '"name": "businessflow-test"' wrangler.businessflow-test.jsonc
          grep -q '"name": "businessflow-live"' wrangler.businessflow-live.jsonc
          ! grep -Eiq 'tradeflow-test|production' wrangler.businessflow-test.jsonc
          ! grep -Eiq 'tradeflow-test|production' wrangler.businessflow-live.jsonc

      - name: Check BusinessFlow storage policy correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sql = Path("businessflow-standalone/supabase/2026-10-23-storage-rls-correction.sql").read_text(encoding="utf-8")
          required = [
              "storage.foldername(objects.name)",
              "s.owner_id = (select auth.uid())",
              "bucket_id = 'businessflow-assets'",
              "for select to authenticated",
              "for insert to authenticated",
              "for update to authenticated",
              "for delete to authenticated",
          ]
          missing = [item for item in required if item not in sql.lower()]
          if missing:
              raise SystemExit("Missing storage-policy protections: " + ", ".join(missing))
          sql_code = "\n".join(line.split("--", 1)[0] for line in sql.splitlines())
          if "storage.foldername(s.name)" in sql_code.lower():
              raise SystemExit("Incorrect policy: checks the site's name rather than the Storage object path")
          print("BusinessFlow Storage RLS correction contains all four owner-scoped policies.")
          PY

      - name: Check account isolation and custom-page IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          checks = {
              "sign-out reloads to clear unsaved account state": "if(error){authMessage('Sign-out failed: '+error.message);return;}location.reload();" in html,
              "successful sign-in reloads the editor": "if(_event==='SIGNED_IN'){location.reload();return;}" in html,
              "direct account switches reload the editor": "if(currentUser&&nextUser&&currentUser.id!==nextUser.id){location.reload();return;}" in html,
              "custom page IDs use UUIDs": "const id='page-'+crypto.randomUUID()" in html,
              "custom page paths retain the complete identifier": "replace(/[^a-z0-9]/gi,'').toLowerCase()||'custom'" in html,
              "logo upload handler exists": "$('uploadAsset').onclick=async()=>" in html,
              "private logo URL refresh handler exists": "async function refreshLogoImage()" in html,
              "logo upload accepts only allowed raster formats": 'accept="image/jpeg,image/png,image/webp,image/gif,image/avif"' in html and "image/svg+xml" not in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if failed:
              raise SystemExit("BusinessFlow isolation checks failed: " + ", ".join(failed))
          PY

      - name: Confirm browser code contains no service-role key
        run: |
          ! grep -Eiq 'service_role|SUPABASE_SERVICE_ROLE_KEY' businessflow-standalone/public/index.html
