name: BusinessFlow Feature Branch TEST Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy-test:
    if: github.ref == 'refs/heads/feature/businessflow-visual-canvas-port'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate TEST-only deployment target
        run: |
          test -f wrangler.businessflow-test.jsonc
          grep -q '"name": "businessflow-test"' wrangler.businessflow-test.jsonc
          ! grep -Eiq 'businessflow-live|tradeflow-test|production' wrangler.businessflow-test.jsonc
          test -f businessflow-standalone/src/worker.js
          test -f businessflow-standalone/public/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("businessflow-standalone/public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/businessflow-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          if "service_role" in html.lower() or "supabase_service_role_key" in html.lower():
              raise SystemExit("Refusing deployment: service-role material found in browser source")
          if "https://ktvvtdrdwlazfsgkfedo.supabase.co" not in html:
              raise SystemExit("Refusing deployment: expected isolated BusinessFlow Supabase project is missing")
          PY
          node --check /tmp/businessflow-inline.js

      - name: Dry-run the TEST deployment
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.businessflow-test.jsonc

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Deploy the feature branch to BusinessFlow TEST only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.businessflow-test.jsonc
