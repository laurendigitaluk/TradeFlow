name: Stripe Connect candidate checks

on:
  push:
    branches:
      - feature/live-stripe-connect-onboarding-20261015
  pull_request:
    branches:
      - production

permissions:
  contents: read

jobs:
  edge-function-typecheck:
    name: Type-check Stripe Connect Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check subscriber settings JavaScript syntax
        run: node --check settings.js

      - name: Verify Stripe Connect settings controls exist
        run: |
          grep -q 'id="stripe-connect-button"' settings.html
          grep -q 'id="stripe-refresh-status"' settings.html
          grep -q 'id="stripe-methods"' settings.html
          grep -q 'settings.js?v=20' settings.html

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check checkout, webhook, onboarding and refund functions
        run: >-
          deno check --no-lock
          supabase/functions/create-stripe-checkout-session/index.ts
          supabase/functions/stripe-payment-webhook/index.ts
          supabase/functions/stripe-connect-onboarding/index.ts
          supabase/functions/process-retail-checkout-refund/index.ts

  candidate-sql-regression:
    name: Exercise candidate Stripe Connect SQL in isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradeflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradeflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Build isolated fixture and apply candidate migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tradeflow_test -v ON_ERROR_STOP=1 -f tests/stripe-connect/sql/fixture.sql
          psql -h localhost -U postgres -d tradeflow_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261016120000_retail_checkout_attempt_reservation.sql
          psql -h localhost -U postgres -d tradeflow_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261016133000_retail_checkout_attempt_account_and_refund_state.sql
          psql -h localhost -U postgres -d tradeflow_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261016143000_process_retail_checkout_attempt_event.sql
          psql -h localhost -U postgres -d tradeflow_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261016170000_retail_checkout_refund_worker_rpcs.sql

      - name: Run settlement, duplicate, mismatch and refund regressions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d tradeflow_test -v ON_ERROR_STOP=1 -f tests/stripe-connect/sql/regression.sql

      - name: Install Python PostgreSQL driver
        run: python -m pip install "psycopg[binary]"

      - name: Test concurrent duplicate Stripe event delivery
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: tradeflow_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python tests/stripe-connect/sql/concurrent_duplicate_event.py
