name: Gemma Research Tests

on:
  pull_request:
    paths:
      - 'tools/tradeflow-gemma-agent/**'
      - 'tools/tradeflow-gemma-desktop/**'
      - 'tools/gemma-agent-isolation/**'
      - 'supabase/migrations/*gemma_agent_scoped_task_claim*'
      - 'platform-owner-dashboard.js'
      - 'platform-owner-dashboard.html'
      - '.github/workflows/gemma-research-tests.yml'
  push:
    branches:
      - production
      - 'gemma/**'
    paths:
      - 'tools/gemma-agent-isolation/**'
      - 'tools/tradeflow-gemma-agent/**'
      - 'tools/tradeflow-gemma-desktop/**'
      - 'platform-owner-dashboard.js'
      - 'platform-owner-dashboard.html'
      - '.github/workflows/gemma-research-tests.yml'

permissions:
  contents: read

jobs:
  gemma-research-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Gemma updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/tradeflow-gemma-agent/Update-TradeFlow-Gemma.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/tradeflow-gemma-agent/Start-TradeFlow-Gemma.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          foreach ($file in @('tools/tradeflow-gemma-agent/Start-Gemma-Agent.ps1','tools/tradeflow-gemma-agent/Update-Gemma-Agent.ps1','tools/gemma-agent-isolation/Install-Gemma-Agents.ps1','tools/gemma-agent-isolation/Gemma-Control-Centre.ps1','tools/gemma-agent-isolation/Update-All-Gemma-Agents.ps1')) {
            if (-not (Test-Path $file)) { continue }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
          foreach ($file in @(
            'tools/tradeflow-gemma-desktop/TradeFlow-Research-Control-Centre.ps1',
            'tools/tradeflow-gemma-desktop/Run-TradeFlow-Gemma-Supervisor.ps1',
            'tools/tradeflow-gemma-desktop/Install-TradeFlow-Research-Control-Centre.ps1'
          )) {
            if (-not (Test-Path $file)) { continue }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Check Gemma source syntax
        shell: bash
        run: |
          for file in tools/tradeflow-gemma-agent/src/*.mjs; do
            node --check "$file"
          done
      - name: Run Gemma task and website playbook tests
        run: |
          node --test \
            tools/tradeflow-gemma-agent/src/control-plane.test.mjs \
            tools/tradeflow-gemma-agent/src/task-groups.test.mjs \
            tools/tradeflow-gemma-agent/src/source-playbooks.test.mjs \
            tools/tradeflow-gemma-agent/src/agent-identity.test.mjs \
            tools/tradeflow-gemma-agent/src/agent-isolation.test.mjs \
            tools/tradeflow-gemma-agent/src/agent-speed.test.mjs \
            tools/tradeflow-gemma-agent/src/agent.source-selection.test.mjs \
            tools/tradeflow-gemma-agent/src/desktop-control.test.mjs \
            tools/tradeflow-gemma-agent/src/task-result-summary.test.mjs
      - name: Check Owner Dashboard JavaScript syntax
        run: node --check platform-owner-dashboard.js
