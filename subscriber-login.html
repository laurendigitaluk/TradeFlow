<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFlow — Sign in</title><link rel="stylesheet" href="platform.css?v=16"><link rel="stylesheet" href="signup.css?v=2"></head><body><header class="topbar"><a class="brand" href="index.html">TradeFlow</a></header><main class="signup-wrap"><section class="signup-card"><div class="eyebrow">Subscriber access</div><h1>Sign in to TradeFlow</h1><p>Access your private business dashboard.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary full" type="submit" id="submit">Sign in</button><div id="message" role="status"></div></form><p class="small">New to TradeFlow? <a href="subscriber-signup.html">Create your business account</a>.</p></section></main><script>window.addEventListener('DOMContentLoaded',()=>{const p=new URLSearchParams(location.search),m=document.getElementById('message');if(p.get('signup')==='created'){m.className='success';m.textContent='Your account has been created. Sign in to continue to secure subscription payment.';}});window.addEventListener('DOMContentLoaded',()=>{const form=document.getElementById('login-form'),msg=document.getElementById('message'),btn=document.getElementById('submit');form.addEventListener('submit',async ev=>{ev.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)throw Error('Enter your email and password.');const h=location.hostname,isTest=h==='localhost'||h==='127.0.0.1'||h.endsWith('.github.io')||h==='tradeflow-test.leannelaurenlowe.workers.dev';const supabaseUrl=isTest?'https://twfbmjwwqzxdxvclxbun.supabase.co':'https://gxsrajtqzdjvmceqcpgv.supabase.co',key=isTest?'sb_publishable_AvcMgtUKV0O5k8H6k94mZQ_qH4pEIS9':'sb_publishable_Y8NRuGXqHNTu9oaolrpprw_wysMNLuz';const r=await fetch(supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const b=await r.json();if(!r.ok||!b.access_token)throw Error(b?.error_description||b?.message||'Sign in failed.');localStorage.setItem('tradeflow_subscriber_session',JSON.stringify(b));const membershipRes=await fetch(supabaseUrl+'/rest/v1/rpc/subscriber_get_my_memberships',{method:'POST',headers:{apikey:key,Authorization:`Bearer ${b.access_token}`,'Content-Type':'application/json'}});const memberships=membershipRes.ok?await membershipRes.json():[];if(Array.isArray(memberships)&&memberships.length){window.location.href='subscriber-dashboard.html';return}const meta=b.user?.user_metadata||{},businessName=String(meta.business_name||'').trim(),planCode=String(meta.plan_code||'').trim();if(businessName&&planCode==='enhanced'){msg.className='success';msg.textContent='Your subscription is required before the business workspace can open. Taking you to secure Stripe checkout…';const checkout=await fetch(supabaseUrl+'/functions/v1/subscriber-create-checkout-session',{method:'POST',headers:{apikey:key,Authorization:`Bearer ${b.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({business_name:businessName,plan_code:planCode})});const ct=await checkout.text();let cb=null;try{cb=ct?JSON.parse(ct):null}catch{}if(!checkout.ok)throw Error(cb?.error||cb?.message||ct||'Unable to start subscription checkout.');if(!cb?.checkout_url)throw Error('Stripe did not return a checkout URL.');window.location.href=cb.checkout_url;return}throw Error('Your account is verified, but it is not connected to a TradeFlow business yet. Please use Get started to begin the subscriber setup.')}catch(err){msg.className='error';msg.textContent=err.message||String(err)}finally{btn.disabled=false;btn.textContent='Sign in'}})});</script></body></html>
